version: 1
frontend:
  phases:
    build:
      commands:
        # Amplify clean URLs resolve extensionless requests through .html files.
        # customHttp.yml keeps this association response application/json.
        - cp .well-known/apple-app-site-association .well-known/apple-app-site-association.html
  artifacts:
    baseDirectory: /
    files:
      - '**/*'
      - '.well-known/*'
  cache:
    paths: []
