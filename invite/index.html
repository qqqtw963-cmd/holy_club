<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="홀리클럽에서 함께할 그룹에 초대받았어요. 앱에서 초대를 확인하고 함께 루틴을 이어가요.">
  <meta property="og:title" content="홀리클럽 그룹 초대">
  <meta property="og:description" content="초대코드 입력 없이 앱에서 함께할 그룹에 참여해요.">
  <title>그룹 초대 · 홀리클럽</title>
  <link rel="stylesheet" href="./invite.css">
  <script src="./invite.js" defer></script>
</head>
<body>
  <main class="card">
    <a class="brand" href="/">HOLYCLUB</a>
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="20" cy="15" r="7"/><path d="M7 39v-5a13 13 0 0 1 26 0v5M33 9a7 7 0 0 1 0 13M39 39v-5a13 13 0 0 0-3-8"/></svg>
    </div>
    <h1 id="title">함께할 그룹에<br>초대받았어요</h1>
    <p id="description">앱에서 초대를 확인하고 함께 루틴을 이어가요.<br>초대코드를 따로 입력할 필요 없어요.</p>
    <a id="open-app" class="primary" hidden>앱에서 초대 확인하기</a>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <section class="install" aria-label="앱 설치 안내">
      <h2>홀리클럽이 처음인가요?</h2>
      <p>앱을 설치한 뒤 <strong>이 초대 링크를 다시 눌러주세요.</strong><br>로그인·가입을 마치면 참여 화면으로 이어져요.</p>
      <div class="stores">
        <a href="https://apps.apple.com/kr/app/id6822851593" rel="noreferrer">App Store</a>
        <a href="https://play.google.com/store/apps/details?id=com.holyclub.app" rel="noreferrer">Google Play</a>
      </div>
    </section>
    <p class="hint">카카오톡 등에서 앱이 열리지 않으면<br>메뉴에서 Safari 또는 Chrome으로 열어주세요.</p>
    <noscript><p class="status">초대 링크를 열려면 브라우저에서 JavaScript를 켜주세요.</p></noscript>
  </main>
</body>
</html>
