customHeaders:
  - pattern: '/.well-known/*'
    headers:
      - key: 'Content-Type'
        value: 'application/json'
      - key: 'Cache-Control'
        value: 'public, max-age=300'
  - pattern: '/invite/*'
    headers:
      - key: 'Referrer-Policy'
        value: 'no-referrer'
      - key: 'X-Robots-Tag'
        value: 'noindex, nofollow'
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
